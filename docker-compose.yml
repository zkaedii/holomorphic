# 🐳 Docker Compose for Holomorphic Signal Processing Suite
version: '3.8'

services:
  # 🧠 Main Holomorphic API Service
  holomorphic-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: holomorphic-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - WORKERS=4
      # SECURITY FIX: No default passwords - must be set in environment
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD environment variable must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY environment variable must be set}
      - PROMETHEUS_ENABLED=true
      # SECURITY FIX: Configure allowed CORS origins
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./plugins:/app/plugins
    depends_on:
      - redis
      - prometheus
    networks:
      - holomorphic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # 🗄️ Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: holomorphic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - holomorphic-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 📊 Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: holomorphic-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - holomorphic-network

  # 📈 Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: holomorphic-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # SECURITY FIX: No default Grafana password
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD environment variable must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
      # SECURITY FIX: Additional Grafana security settings
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_DISABLE_SIGNOUT_MENU=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - holomorphic-network
    depends_on:
      - prometheus

  # 🔄 Load Balancer (NGINX)
  nginx:
    image: nginx:alpine
    container_name: holomorphic-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - holomorphic-api
    networks:
      - holomorphic-network

# 🗂️ Named volumes for persistent data
volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# 🌐 Network configuration
networks:
  holomorphic-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16